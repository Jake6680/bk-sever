<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serial Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .info-group {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .info-label {
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-value {
      font-size: 16px;
      color: #333;
      word-break: break-all;
    }

    .status-box {
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .status-valid {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }

    .status-invalid {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    .status-unknown {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      color: white;
    }

    .status-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .status-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .status-detail {
      font-size: 14px;
      opacity: 0.9;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .log-container {
      max-height: 200px;
      overflow-y: auto;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 5px;
      border-left: 3px solid #667eea;
      padding-left: 10px;
    }

    .log-time {
      color: #888;
      margin-right: 10px;
    }

    .footer {
      text-align: center;
      color: white;
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.8;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔐 Serial Client</h1>
      <p class="subtitle">자동 라이선스 검증 프로그램</p>

      <div id="statusBox" class="status-box status-unknown">
        <div class="status-icon">⏳</div>
        <div class="status-text">검증 대기 중...</div>
        <div class="status-detail">서버에 연결하는 중입니다</div>
      </div>

      <div class="info-group">
        <div class="info-label">PC 시리얼 번호</div>
        <div class="info-value" id="serialNumber">불러오는 중...</div>
      </div>

      <div class="info-group">
        <div class="info-label">다음 검증 시간</div>
        <div class="info-value" id="nextCheck">1시간 후</div>
      </div>

      <div class="info-group">
        <div class="info-label">서버 주소</div>
        <div class="info-value" id="serverUrl">http://localhost:3000</div>
      </div>

      <button class="btn btn-primary" onclick="checkNow()">지금 검증하기</button>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 15px; font-size: 18px; color: #667eea;">📋 로그</h2>
      <div class="log-container" id="logContainer">
        <div class="log-entry">
          <span class="log-time">[시작]</span>
          <span>프로그램이 시작되었습니다.</span>
        </div>
      </div>
    </div>

    <div class="footer">
      Serial Client v1.0.0<br>
      백그라운드에서 자동으로 실행됩니다
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
